apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: alumno-team4
data:
  APP_TIMEZONE: "America/Montevideo"
  DEFAULT_ORDER_CUTOFF_MINUTES: "15"
  CORS_ALLOWED_ORIGINS: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: alumno-team4
type: Opaque
stringData:
  JWT_SECRET: "dev-secret-cambiar-en-produccion"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: alumno-team4
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: luispee/devops-project-cafeteria-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: alumno-team4
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: alumno-team4
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: luispee/devops-project-cafeteria-frontend:latest 
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: alumno-team4
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedidos-ingress
  namespace: alumno-team4
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: pedidos.reto-ucu.net
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-svc
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80