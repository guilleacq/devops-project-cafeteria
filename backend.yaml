apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: alumno-team4
data:
  APP_TIMEZONE: "America/Montevideo"
  REPOSITORY_BACKEND: "memory"
  DEFAULT_ORDER_CUTOFF_MINUTES: "15"
  CORS_ALLOWED_ORIGINS: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: alumno-team4
type: Opaque
stringData:
  JWT_SECRET: "dev-secret-cambiar-en-produccion"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: alumno-team4
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: luispee/devops-project-cafeteria-backend:latest # <-- Reemplaza con la imagen real de tu backend
        ports:
        - containerPort: 8000 # Coincide con el puerto del compose
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe: # Kubernetes usa livenessProbe/readinessProbe para esto
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: alumno-team4
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8000